services:
  mysql:
    image: mysql:8.4
    container_name: vantelyx-clm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vantelyx_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vantelyx_clm}
      MYSQL_USER: ${MYSQL_USER:-vantelyx_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vantelyx_password}
    ports:
      - "3306:3306"
    volumes:
      - vantelyx_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server/Vantelyx.Api
    container_name: vantelyx-clm-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8088
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-vantelyx_clm};User=${MYSQL_USER:-vantelyx_user};Password=${MYSQL_PASSWORD:-vantelyx_password};
      ConnectionStrings__MySql: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-vantelyx_clm};User=${MYSQL_USER:-vantelyx_user};Password=${MYSQL_PASSWORD:-vantelyx_password};
    ports:
      - "8088:8088"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./client
    container_name: vantelyx-clm-web
    restart: unless-stopped
    ports:
      - "9701:80"
    depends_on:
      - api

volumes:
  vantelyx_mysql_data:
